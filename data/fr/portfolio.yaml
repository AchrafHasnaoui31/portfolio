process:
  badge: 05 PROCESSUS
  title: Mon Processus d'Ingénierie & de Conception
  sub: 'Une démarche méthodique éprouvée pour transformer un cahier des charges complexe
    en un système robuste et sécurisé :'
  steps:
  - num: '01'
    title: ANALYSE & CADRAGE
    icon: 🔍
    desc: Compréhension approfondie du problème, modélisation des besoins utilisateurs,
      contraintes matérielles et analyse de la surface d'attaque.
  - num: '02'
    title: ARCHITECTURE & DESIGN
    icon: 📐
    desc: Conception modulaire (UML/Schémas), choix des technologies adaptées (Spring/Python/ESP32),
      modélisation des données et API contracts.
  - num: '03'
    title: DÉVELOPPEMENT & CODE
    icon: </>
    desc: Implémentation rigoureuse selon les principes Clean Code, programmation
      orientée objet, conception de firmware bas-niveau ou microservices.
  - num: '04'
    title: TESTS & SÉCURITÉ
    icon: 🛡️
    desc: Tests unitaires et d'intégration, vérification de robustesse, audits de
      sécurité, analyse de vulnérabilités et validation des KPI.
  - num: '05'
    title: DÉPLOIEMENT & SUIVI
    icon: 🚀
    desc: Automatisation des pipelines CI/CD sous GitHub Actions, conteneurisation
      Docker, mise en production Cloud et télémétrie continue.
