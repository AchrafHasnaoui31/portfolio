about:
  badge: À Propos
  title: Un profil d'ingénieur curieux, polyvalent et orienté produit
  sub: De la conception mécanique et électronique jusqu'au déploiement Cloud et à
    l'intelligence artificielle.
  paragraphs:
  - Actuellement en **3e année du cycle ingénieur en Génie Informatique à l'ENSIT**
    (Tunis), après avoir réussi le cycle préparatoire technologique à l'**IPEIM avec
    Mention Bien**, je possède une formation d'ingénieur rigoureuse combinant solides
    bases mathématiques, informatique théorique et compétences appliquées.
  - 'Mon parcours professionnel m''a permis de me confronter très tôt aux exigences
    du monde industriel : développement d''un CRM logistique chez **Airstruct Consulting**
    (Spring Boot), et optimisation de la télémétrie de véhicules électriques chez
    **Bako Motors**, où mes modules ont réduit de **47% les retards de maintenance**
    et prolongé de **37% la durée de vie des composants**.'
  - En parallèle, je m'investis activement au sein de l'équipe technique de **Securinets
    ENSIT** (le club de cybersécurité référence), participant et remportant des compétitions
    nationales de **CTF (1ère place à Cat The Flag)**, animant des ateliers de forensics/cryptographie
    et développant des bancs de tests matériels sur ESP32.
  techBadgesTitle: 'Technologies fréquemment utilisées :'
  tech:
  - Java / Spring Boot / JPA
  - Python (PyTorch, FastAPI, Flask)
  - Docker & GitHub Actions CI/CD
  - AWS Cloud (IAM, S3, EC2)
  - C / C++ & Linux Embarqué
  - ESP32 (ESP-IDF, Arduino, FreeRTOS)
  - PostgreSQL, MySQL, MongoDB
  - React, Flutter & Ionic
  - Wireshark, Burp, Nmap, Ghidra
  - MLflow, ONNX, QLoRA, RAG
