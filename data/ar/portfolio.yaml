about:
  badge: نبذة عني
  title: مهندس شغوف بالأنظمة المعقدة وصناعة الأثر الإيجابي
  sub: من التصميم الميكانيكي والإلكتروني حتى النشر السحابي وحلول الذكاء الاصطناعي.
  paragraphs:
  - أدرس حالياً بـ **السنة الثالثة من المرحلة الهندسية في اختصاص الهندسة الإعلامية
    بالمدرسة الوطنية العليا للمهندسين بتونس (ENSIT)**، بعد إحرازي للقبول من المعهد
    التحضيري للدراسات الهندسية بالمنستير (IPEIM) بـ **ملاحظة حسن**، حيث تلقيت تكويناً
    علمياً متيناً يجمع بين الرياضيات الدقيقة والمعارف الحاسوبية المتقدمة.
  - 'مكّنتني تجاربي الميدانية في الشركات من خوض التحديات الواقعية للإنتاج: تطوير نظام
    CRM للشحن الدولي في **Airstruct Consulting** (Spring Boot)، وتطوير وحدة تتبع بيانات
    الصيانة الوقائية في شركة **Bako Motors** التونسية للسيارات الكهربائية، حيث أسهمت
    برمجياتي في **خفض التأخيرات بنسبة 47%** وإطالة **عمر القطع بنسبة 37%**.'
  - وإلى جانب دراستي، أنشط كعضو فاعل في الفريق التقني لنادي **Securinets ENSIT** الرائد
    في مجال الأمن السيبراني، حيث أحرزت **المرتبة الأولى الوطنية في مسابقة Cat The
    Flag**، وأشرفت على تنظيم ورشات عمل في التحقيق الجنائي الرقمي والتشفير وتصميم منصات
    الاختبار العتادية.
  techBadgesTitle: 'التقنيات التي أعمل بها بشكل يومي:'
  tech:
  - Java / Spring Boot / JPA
  - Python (PyTorch, FastAPI, Flask)
  - Docker & GitHub Actions CI/CD
  - AWS Cloud (IAM, S3, EC2)
  - C / C++ & Linux Embarqué
  - ESP32 (ESP-IDF, Arduino, FreeRTOS)
  - PostgreSQL, MySQL, MongoDB
  - React, Flutter & Ionic
  - Wireshark, Burp, Nmap, Ghidra
  - MLflow, ONNX, QLoRA, RAG
  facts:
