about:
  badge: 01 الهوية والمعمارية الهندسية
  title: 'مهندس إعلامية بملف تقني متكامل: من المادة والتصنيع الميكانيكي CNC إلى الكود
    عالي الأداء للروبوتات'
  sub: 'لماذا يشكل الأساس المتين في الميكانيكا والإلكترونيات السلاح الأقوى لمهندس
    برمجيات النخبة:'
  paragraphs:
  - 'أتابع حالياً **السنة الختامية في الهندسة الإعلامية بالمدرسة الوطنية العليا للمهندسين
    بتونس (ENSIT)**، بعد نجاحي المتميز في المناظرة الوطنية للدخول لمدارس المهندسين
    ضمن شعبة **الفيزياء والتكنولوجيا (PT) بـ IPEIM بملاحظة حسن**. انطلقت مسيرتي بانغماس
    تطبيقي كامل في الميكانيكا والكهرباء: حساب الموترات، ميكانيكا الأجسام الصلبة، حركية
    الروبوتات، مقاومة المواد، إلكترونيات القدرة، والممارسة المكثفة في الورشات على
    **آلات التشغيل الميكانيكي (الخراطة والتفريز CNC واليدوي)** والنمذجة **ثلاثية الأبعاد
    عبر SolidWorks**.'
  - 'وبينما كان تميزي في الميكانيكا والكهرباء يفتح أمامي مسار الهندسة الميكانيكية
    التقليدية، **اتخذت قراراً استراتيجياً استباقياً: الانتقال إلى الهندسة الإعلامية
    بـ ENSIT**. كان هدفي واضحاً: الإحاطة بكامل السلسلة التكنولوجية لـ **الروبوتات
    المعاصرة، الآلات ذاتية التحكم والأتمتة الذكية**. فأفضل روبوتات العالم لا يمكن
    أن يبنيها مهندسو ميكانيكا يجهلون خوارزميات الزمن الحقيقي والأمن السيبراني، ولا
    مبرمجون معزولون يجهلون قوى الاحتكاك وعزم المحركات والقصور الذاتي والواقع الفيزيائي
    للسيليكون.'
  - 'في ENSIT، صقلت هندسة البرمجيات لأعلى مستويات الكفاءة: **برمجة C/C++ فائقة الأداء،
    أنظمة التشغيل في الزمن الحقيقي (FreeRTOS، لينكس المدمج)، الخدمات المصغرة الموزعة
    (Spring Boot، Python)، خطوط السحابة والأمن السيبراني (المرتبة الأولى الوطنية في
    مسابقة Cat The Flag)**. ولدى شركة **Bako Motors** للسيارات الكهربائية، نجحت منظومتي
    للاتصال عن بعد في **خفض تأخيرات الصيانة بنسبة 47%**. اليوم، أتحكم في المعمارية
    كاملة: من تصنيع المعدن على الآلات إلى الكود المحكم المنشور على السحابة.'
  techBadgesTitle: 'التقنيات التي أعمل بها بشكل يومي:'
  tech:
  - Java / Spring Boot / JPA
  - Python (PyTorch, FastAPI, Flask)
  - Docker & GitHub Actions CI/CD
  - AWS Cloud (IAM, S3, EC2)
  - C / C++ & Linux Embarqué
  - ESP32 (ESP-IDF, Arduino, FreeRTOS)
  - PostgreSQL, MySQL, MongoDB
  - React, Flutter & Ionic
  - Wireshark, Burp, Nmap, Ghidra
  - MLflow, ONNX, QLoRA, RAG
