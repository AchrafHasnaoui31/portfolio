hero:
  statusPill: 🟢 في بحث نشط عن تربص PFE (6 أشهر) · فيفري/مارس 2027 · روبوتات، أتمتة
    ذكية، هندسة إعلامية وسحابة · تونس 🇹🇳 · فرنسا 🇫🇷 · دولياً 🌍
  greeting: مرحباً، أنا
  name: أشرف حسناوي
  roles:
  - طالب مهندس في الهندسة الإعلامية (ENSIT - السنة الختامية).
  - 'ملف تقني متكامل: الروبوتات، الأتمتة والأنظمة الذكية.'
  - 'ثنائية علمية: أساس ميكانيكي وتصنيع CNC (تحضيري تكنولوجي) + هندسة برمجيات (ENSIT).'
  - مطور برمجيات عتادية C/C++ عالية الأداء، FreeRTOS ولينكس المدمج.
  - مهندس خدمات مصغرة ومعماريات خلفية (Java/Spring Boot, Python, Cloud).
  - ممارس في الأمن السيبراني وبطل مسابقة Cat The Flag الوطنية.
  tagline: طالب مهندس في **السنة الختامية إعلامية بالمدرسة الوطنية العليا للمهندسين
    بتونس (ENSIT)**، أجمع بين **أساس ميكانيكي وإلكتروني متين وهندسة برمجية متقدمة
    لتصميم وتطوير الروبوتات والأنظمة المؤتمتة الذكية**. بعد نيلي **الباكالوريا التقنية**
    وسنتين في **المعهد التحضيري للدراسات الهندسية (شعبة الفيزياء والتكنولوجيا IPEIM
    - ملاحظة حسن)** أين أتقنت التصنيع الميكانيكي الدقيق (التشغيل بالخراطة والتفريز
    CNC واليدوي، النمذجة ثلاثية الأبعاد بـ SolidWorks، حركية الآليات ومقاومة المواد)،
    اتخذت خياراً استراتيجياً متعمداً بالالتحاق بالهندسة الإعلامية للتحكم في معمارية
    الأنظمة المستقلة من البداية إلى النهاية. من تصنيع القطع المعدنية والتحكم بالمحركات
    إلى الأكواد البرمجية C/C++ في الزمن الحقيقي، الحوسبة السحابية وتأمين المنظومات،
    أصمم آلات ذكية متكاملة وعالية الكفاءة. **في بحث نشط عن تربص لختم الدروس (PFE)
    لمدة 6 أشهر انطلاقاً من فيفري/مارس 2027 في تونس 🇹🇳، فرنسا 🇫🇷 ودولياً 🌍.**
  photo: images/achraf.jpg
  cardName: أشرف حسناوي
  cardRole: طالب مهندس في الهندسة الإعلامية (سنة ثالثة · روبوتات وأنظمة ذكية)
  cardInfo:
  - 📍 تونس / قابس · استعداد كامل للتنقل (تونس 🇹🇳، فرنسا 🇫🇷، دولياً 🌍)
  - 🎓 ENSIT (سنة ثالثة إعلامية) + IPEIM (تحضيري تكنولوجي بملاحظة حسن)
  - '⚙️ ملف هجين: ميكانيكا وتصنيع CNC، إلكترونيات، برمجيات C/C++، سحابة وأمن'
  - 🚀 بحث عن تربص PFE مدة 6 أشهر انطلاقاً من فيفري / مارس 2027
