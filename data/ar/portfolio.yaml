experience:
  badge: Expériences Professionnelles
  title: Missions en entreprise & réalisations à impact
  sub: 'Des projets concrets menés en conditions industrielles avec des résultats
    quantifiables :'
  items:
  - date: 06/2026 — 08/2026
    role: Stagiaire Développeur Logiciel / Full Stack
    org: Airstruct Consulting
    location: Tunisie
    context: Société spécialisée dans le transport international aérien et maritime
      de marchandises (import-export).
    bullets:
    - Conception et réalisation d'une application web Full Stack avec Spring Boot
      / JPA côté backend et interfaces modernes de gestion.
    - 'Développement d''un CRM dédié à l''activité commerciale : suivi des collaborateurs,
      gestion des rendez-vous clients, rédaction des comptes rendus et suivi des voyages
      d''affaires programmés.'
    - Création de tableaux de bord interactifs et calcul automatisé d'indicateurs
      KPI de pilotage pour mesurer les performances individuelles et globales.
    - 'Participation active à l''intégralité du cycle de livraison : analyse fonctionnelle,
      conception de l''architecture, implémentation, tests et recette utilisateur.'
    tags:
    - Java
    - Spring Boot
    - JPA / Hibernate
    - CRM
    - Tableaux de Bord KPI
    - REST API
    - Full Stack
  - date: 06/2025 — 07/2025
    role: Stagiaire Ingénieur Développement Logiciel
    org: Bako Motors (Constructeur Automobile Électrique)
    location: Tunisie
    context: Constructeur automobile innovant de véhicules utilitaires et solaires
      100% électriques pour la livraison du dernier kilomètre.
    bullets:
    - Développement du module de traçabilité des résultats d'essais et des cycles
      de maintenance au sein de la plateforme connectée de suivi des véhicules.
    - '**Résultat mesuré** : Réduction de **47%** des dépassements d''échéances de
      maintenance préventive grâce à un système intelligent de suivi et d''alertes
      anticipées.'
    - '**Résultat mesuré** : Allongement effectif de **37%** de la durée de vie moyenne
      des pièces sous surveillance par rapport au fonctionnement sans suivi télémétrique.'
    - Intégration d'outils de traçabilité des anomalies pour faciliter les interventions
      des équipes de maintenance en atelier.
    - Travail collaboratif au sein d'une équipe pluridisciplinaire d'ingénieurs (mécanique,
      électronique embarquée, logiciel).
    tags:
    - Génie Logiciel
    - Traçabilité Flotte
