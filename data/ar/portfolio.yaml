    - k: المنطقة والتنقل
      v: قابس / تونس · استعداد كامل للتنقل إلى فرنسا
    - k: الهدف الحالي
      v: تربص ختم الدروس (PFE) لمدة 6 أشهر
    - k: الركائز الأساسية
