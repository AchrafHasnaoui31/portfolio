        إدارة دقيقة للذاكرة وحلقات تحكم فائقة السرعة.
      skills:
      - C/C++ فائق الأداء
      - FreeRTOS والزمن الحقيقي
      - لينكس المدمج
      - إدارة الذاكرة ومعالجة الإشارات
    - num: '04'
      badge: البرمجيات والسحابة
      title: المعماريات الموزعة، السحابة والأمن السيبراني
      icon: 🛡️
