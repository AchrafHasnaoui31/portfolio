hero:
  statusPill: في بحث نشط عن تربص ختم الدروس (6 أشهر) · بداية من فيفري/مارس 2027 ·
    فرنسا
  greeting: مرحباً، أنا
  name: أشرف حسناوي
  roles:
  - طالب مهندس في الهندسة الإعلامية (ENSIT سنة ثالثة)
  - مطور برمجيات Full Stack & Backend (Spring Boot, Python, React)
  - ممارس في الأمن السيبراني وعضو الفريق التقني Securinets ENSIT
  - شغوف بالحوسبة السحابية وأتمتة CI/CD (AWS, Docker)
  - مهندس ذكاء اصطناعي ومعالجة الإشارات الصوتية (PyTorch, QLoRA, MLflow)
  - مطور ومبتكر أنظمة مدمجة وروبوتات (ESP32, C/C++)
