      الأداء:'
    layers:
    - num: '01'
      badge: الميكانيكا والتصنيع
      title: الأساس الفيزيائي، النمذجة والتشغيل الميكانيكي CNC
      icon: ⚙️
      accent: cyan
      desc: تصميم ثلاثي الأبعاد بـ SolidWorks، حركية وديناميكا الآليات، التشغيل الميكانيكي
        الدقيق بالخراطة والتفريز CNC واليدوي، ومقاومة المواد.
      skills:
