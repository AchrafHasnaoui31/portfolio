recruiterSnapshot:
  badge: ملخص للمسؤولين عن التوظيف
  title: القيمة المضافة التي أقدمها مباشرة لفريقكم الهندسي
  sub: 'نظرة شاملة مدعمة بالأرقام لمسؤولي التوظيف والمدراء التقنيين:'
  cards:
  - title: شروط وتوقيت التربص
    icon: 🎯
    items:
    - '**نوع العقد**: تربص ختم الدروس (PFE) لمدة 6 أشهر باتفاقية من مدرسة المهندسين
      ENSIT'
    - '**فترة الانطلاق**: فيفري / مارس 2027 (مدة مرنة بين 5 و 6 أشهر)'
    - '**الموقع الجغرافي**: فرنسا كاملة (استعداد تام للتنقل والاستقرار) أو دولياً'
    - '**المجالات المستهدفة**: هندسة البرمجيات، DevOps/Cloud، الأمن السيبراني، الذكاء
      الاصطناعي، إنترنت الأشياء'
  - title: نتائج ملموسة وأرقام محققة
    icon: 📊
    items:
    - '**Bako Motors**: تخفيض بنسبة **47%** في تجاوز آجال الصيانة الوقائية وإطالة
      عمر القطع بنسبة **37%+**'
    - '**Securinets ENSIT**: إحراز **المرتبة الأولى** في مسابقة الأمن السيبراني Cat
      The Flag وتصميم تحديات أمنية'
    - '**Airstruct Consulting**: إنجاز منصة CRM متكاملة بتقنية Spring Boot مع لوحات
      مؤشرات الأداء اللوجستي الدولي'
    - '**التميز الدراسي**: **ملاحظة حسن** في كل من المناظرة الوطنية للترشيح لمدارس
      المهندسين والباكالوريا'
  - title: المنهجية الهندسية والجاهزية
    icon: 🧩
    items:
    - '**رؤية شاملة للمنتج**: من تحليل متطلبات المستخدم إلى النشر المؤتمت عبر خطوط
      CI/CD'
    - '**تعددية تخصصية نادرة**: القدرة على التعامل السلس مع العتاد الإلكتروني المدمج،
      السحابة، ونماذج الذكاء الاصطناعي'
    - '**دقة علمية واستقلالية**: خلفية رياضية وفيزيائية متينة تدعم حل المعضلات التقنية
      المعقدة'
    - '**لغات التواصل**: إتقان تام للفرنسية والإنجليزية التقنية إلى جانب اللغة الأم
      العربية'
