about:
  badge: About Me
  title: Curious, versatile, and product-focused engineer
  sub: From mechanical and electronic prototyping to Cloud deployment and artificial
    intelligence.
  paragraphs:
  - Currently in my **3rd year of Computer Engineering at ENSIT** (Tunis), having
    graduated with **Honors (Mention Bien)** from the selective preparatory engineering
    cycle at **IPEIM**, I bring a rigorous engineering background uniting strong mathematical
    foundations with applied software mastery.
  - 'My industry experience gave me early exposure to production environments: delivering
    a full-stack logistics CRM at **Airstruct Consulting** (Spring Boot), and optimizing
    electric vehicle fleet telemetry at **Bako Motors**, where my modules reduced
    **overdue maintenance by 47%** and prolonged **monitored component lifespan by
    37%**.'
